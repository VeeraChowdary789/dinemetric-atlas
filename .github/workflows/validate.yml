name: Validate analysis
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare_data.py
      - run: node --check dist/app.js
      - run: npm test
      - run: git diff --exit-code -- dist/data.js data/processed/restaurants.csv data/processed/audit.json
